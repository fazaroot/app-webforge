[package]
name = "webforge-sendmail-shim"
version = "0.5.0"
edition = "2021"
description = "Shim sendmail WebForge Mobile: menerima pesan RFC822 ala sendmail dan mengirimnya lewat SMTP"

[[bin]]
name = "webforge-sendmail"
path = "src/main.rs"

[dependencies]
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "rustls-tls", "hostname"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
