# WebForge Mobile CI — Rust core + frontend + PHP bundle + APK debug (Capacitor)
#
# Catatan:
# - TIDAK memakai android-actions/setup-android (pernah gagal di TeleCore).
#   Runner ubuntu-latest sudah menyediakan Android SDK + NDK.
# - libwebforge_core.so dihasilkan cargo-ndk di job android dan tidak
#   pernah di-commit.
# - PHP 8.2/8.3/8.4 (CLI + FPM) di-cross-compile di job build-php
#   (matriks) lewat scripts/native/build-php.sh untuk
#   aarch64-linux-android (API 26), tidak pernah di-commit. Hasil per
#   versi: libphp<82|83|84>.so + libphpfpm<82|83|84>.so +
#   icudt74l.dat (data ICU 74.2). Ekstensi wajib: bcmath, ctype, dom,
#   fileinfo, filter, hash, json, libxml, mbstring, openssl, pdo,
#   pdo_sqlite, phar, posix, session, simplexml, sockets, sqlite3,
#   tokenizer, xml, xmlreader, xmlwriter, zip, zlib, curl, gd, exif,
#   soap, ftp, pcntl, intl — diverifikasi build-php.sh lewat simbol
#   phpext_<ext>_ptr pada CLI dan FPM, gagal keras bila ada yang
#   hilang. Daftar nyata di perangkat berasal dari `php -m` lewat
#   endpoint /api/runtimes/php/info.
# - libsendmail.so (shim sendmail untuk PHP mail()) dibangun di job
#   build-sendmail dari crate sendmail-shim/ (cargo-ndk arm64).
# - composer.phar 2.11.3 (sha256 resmi getcomposer.org) dan cacert.pem
#   Mozilla (curl.se) diunduh di job android sebagai aset APK.
# - Belum ada job release APK: signing belum dikonfigurasi.

name: WebForge Mobile CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (Rust)
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/
            ~/.cargo/git/
            core/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('core/Cargo.toml', 'core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cargo test
        run: cargo test --manifest-path core/Cargo.toml

      - name: Cargo build (release)
        run: cargo build --release --manifest-path core/Cargo.toml

  frontend:
    name: Frontend (React/Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Test
        working-directory: frontend
        run: npx vitest run

      - name: Build
        working-directory: frontend
        run: npm run build

  build-php:
    name: PHP ${{ matrix.php_series }} CLI+FPM (Android arm64)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php_series: "8.2"
            php_version: "8.2.36"
            suffix: "82"
          - php_series: "8.3"
            php_version: "8.3.37"
            suffix: "83"
          - php_series: "8.4"
            php_version: "8.4.28"
            suffix: "84"
    env:
      PHP_VERSION: ${{ matrix.php_version }}
      PHP_SERIES: ${{ matrix.php_series }}
      ANDROID_API: "26"
      OUTPUT_DIR: ${{ github.workspace }}/php-out
      WORK_DIR: ${{ github.workspace }}/php-work/${{ matrix.suffix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Locate Android NDK
        run: |
          if [ -z "$ANDROID_NDK_HOME" ]; then
            NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
            if [ -z "$NDK_DIR" ]; then
              echo "::error::Android NDK tidak ditemukan di $ANDROID_HOME/ndk"
              exit 1
            fi
            echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          fi
          echo "NDK: ${ANDROID_NDK_HOME:-$NDK_DIR}"

      - name: Cache PHP ${{ matrix.php_series }} build
        id: php-cache
        uses: actions/cache@v4
        with:
          path: php-out
          key: php-${{ matrix.php_version }}-android26-arm64-${{ hashFiles('scripts/native/build-php.sh') }}-ext-bcmath-ctype-dom-fileinfo-filter-hash-json-libxml-mbstring-openssl-pdo-pdo_sqlite-phar-posix-session-simplexml-sockets-sqlite3-tokenizer-xml-xmlreader-xmlwriter-zip-zlib-curl-gd-exif-soap-ftp-pcntl-intl-fpm

      - name: Build PHP ${{ matrix.php_version }} (CLI + FPM)
        if: steps.php-cache.outputs.cache-hit != 'true'
        run: bash scripts/native/build-php.sh

      - name: Verify PHP ${{ matrix.php_series }} artifacts
        run: |
          for f in "php-out/libphp${{ matrix.suffix }}.so" "php-out/libphpfpm${{ matrix.suffix }}.so" "php-out/icudt74l.dat"; do
            if [ ! -f "$f" ]; then
              echo "::error::Artifact PHP tidak ditemukan: $f"
              exit 1
            fi
            ls -lh "$f"
          done
          for so in "php-out/libphp${{ matrix.suffix }}.so" "php-out/libphpfpm${{ matrix.suffix }}.so"; do
            file "$so"
            if ! readelf -h "$so" | grep -q "AArch64"; then
              echo "::error::$so bukan ELF AArch64"
              exit 1
            fi
          done

      - name: Upload PHP ${{ matrix.php_series }} binaries
        uses: actions/upload-artifact@v4
        with:
          name: php${{ matrix.suffix }}-android-arm64
          path: |
            php-out/libphp${{ matrix.suffix }}.so
            php-out/libphpfpm${{ matrix.suffix }}.so
            php-out/icudt74l.dat
          if-no-files-found: error

  build-caddy:
    name: Caddy (Android arm64)
    runs-on: ubuntu-latest
    env:
      ANDROID_API: "26"
      OUTPUT_DIR: ${{ github.workspace }}/caddy-out
      OUT_DIR: ${{ github.workspace }}/caddy-out
      WORK_DIR: ${{ github.workspace }}/native-work/caddy
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache Caddy (Android arm64) build
        uses: actions/cache@v4
        with:
          path: native-work/caddy
          key: build-caddy-${{ hashFiles('scripts/native/build-caddy.sh') }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build Caddy (Android arm64)
        run: bash scripts/native/build-caddy.sh

      - name: Upload Caddy (Android arm64) artifact
        uses: actions/upload-artifact@v4
        with:
          name: caddy-android-arm64
          path: |
            caddy-out/libcaddy.so
          if-no-files-found: error
  build-nginx:
    name: Nginx (Android arm64)
    runs-on: ubuntu-latest
    env:
      ANDROID_API: "26"
      OUTPUT_DIR: ${{ github.workspace }}/nginx-out
      OUT_DIR: ${{ github.workspace }}/nginx-out
      WORK_DIR: ${{ github.workspace }}/native-work/nginx
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Locate Android NDK
        run: |
          if [ -z "$ANDROID_NDK_HOME" ]; then
            NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
            if [ -z "$NDK_DIR" ]; then
              echo "::error::Android NDK tidak ditemukan di $ANDROID_HOME/ndk"
              exit 1
            fi
            echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          fi
          echo "NDK: ${ANDROID_NDK_HOME:-$NDK_DIR}"

      - name: Cache Nginx (Android arm64) build
        uses: actions/cache@v4
        with:
          path: native-work/nginx
          key: build-nginx-${{ hashFiles('scripts/native/build-nginx.sh') }}

      - name: Build Nginx (Android arm64)
        run: bash scripts/native/build-nginx.sh

      - name: Upload Nginx (Android arm64) artifact
        uses: actions/upload-artifact@v4
        with:
          name: nginx-android-arm64
          path: |
            nginx-out/libnginx.so
          if-no-files-found: error
  build-apache:
    name: Apache httpd (Android arm64)
    runs-on: ubuntu-latest
    env:
      ANDROID_API: "26"
      OUTPUT_DIR: ${{ github.workspace }}/apache-out
      OUT_DIR: ${{ github.workspace }}/apache-out
      WORK_DIR: ${{ github.workspace }}/native-work/apache
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Locate Android NDK
        run: |
          if [ -z "$ANDROID_NDK_HOME" ]; then
            NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
            if [ -z "$NDK_DIR" ]; then
              echo "::error::Android NDK tidak ditemukan di $ANDROID_HOME/ndk"
              exit 1
            fi
            echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          fi
          echo "NDK: ${ANDROID_NDK_HOME:-$NDK_DIR}"

      - name: Cache Apache httpd (Android arm64) build
        uses: actions/cache@v4
        with:
          path: native-work/apache
          key: build-apache-${{ hashFiles('scripts/native/build-apache.sh') }}

      - name: Build Apache httpd (Android arm64)
        run: bash scripts/native/build-apache.sh

      - name: Upload Apache httpd (Android arm64) artifact
        uses: actions/upload-artifact@v4
        with:
          name: apache-android-arm64
          path: |
            apache-out/libhttpd.so
          if-no-files-found: error
  build-python:
    name: Python 3.12 (Android arm64)
    runs-on: ubuntu-latest
    env:
      ANDROID_API: "26"
      OUTPUT_DIR: ${{ github.workspace }}/python-out
      OUT_DIR: ${{ github.workspace }}/python-out
      WORK_DIR: ${{ github.workspace }}/python-build
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Locate Android NDK
        run: |
          if [ -z "$ANDROID_NDK_HOME" ]; then
            NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
            if [ -z "$NDK_DIR" ]; then
              echo "::error::Android NDK tidak ditemukan di $ANDROID_HOME/ndk"
              exit 1
            fi
            echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          fi
          echo "NDK: ${ANDROID_NDK_HOME:-$NDK_DIR}"

      - name: Cache Python 3.12 (Android arm64) build
        uses: actions/cache@v4
        with:
          path: python-build
          key: build-python-${{ hashFiles('scripts/native/build-python.sh') }}

      - name: Build Python 3.12 (Android arm64)
        run: bash scripts/native/build-python.sh

      - name: Upload Python 3.12 (Android arm64) artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-android-arm64
          path: |
            python-out/libpython.so
            python-out/python-stdlib.zip
            python-out/python-version.txt
          if-no-files-found: error
  build-node:
    name: Node.js (nodejs-mobile arm64)
    runs-on: ubuntu-latest
    env:
      ANDROID_API: "26"
      OUTPUT_DIR: ${{ github.workspace }}/node-out
      OUT_DIR: ${{ github.workspace }}/node-out
      WORK_DIR: ${{ github.workspace }}/node-build
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Locate Android NDK
        run: |
          if [ -z "$ANDROID_NDK_HOME" ]; then
            NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
            if [ -z "$NDK_DIR" ]; then
              echo "::error::Android NDK tidak ditemukan di $ANDROID_HOME/ndk"
              exit 1
            fi
            echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          fi
          echo "NDK: ${ANDROID_NDK_HOME:-$NDK_DIR}"

      - name: Cache Node.js (nodejs-mobile arm64) build
        uses: actions/cache@v4
        with:
          path: node-build
          key: build-node-${{ hashFiles('scripts/native/build-node.sh') }}


      - name: Build Node.js (nodejs-mobile arm64)
        run: bash scripts/native/build-node.sh

      - name: "Repack npm.tgz menjadi npm.zip (root package/)"
        run: |
          mkdir -p npm-repack
          tar -xzf node-out/npm.tgz -C npm-repack
          test -f npm-repack/package/bin/npm-cli.js
          (cd npm-repack && zip -qr ../node-out/npm.zip package)
          ls -lh node-out/npm.zip

      - name: Upload Node.js (nodejs-mobile arm64) artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-android-arm64
          path: |
            node-out/libnode.so
            node-out/libwebforge_node.so
            node-out/libc++_shared.so
            node-out/npm.zip
            node-out/node-version.txt
          if-no-files-found: error
  build-postgres:
    name: PostgreSQL 16 (Android arm64)
    runs-on: ubuntu-latest
    env:
      ANDROID_API: "26"
      OUTPUT_DIR: ${{ github.workspace }}/postgres-out
      OUT_DIR: ${{ github.workspace }}/postgres-out
      WORK_DIR: ${{ github.workspace }}/db-build/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Locate Android NDK
        run: |
          if [ -z "$ANDROID_NDK_HOME" ]; then
            NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
            if [ -z "$NDK_DIR" ]; then
              echo "::error::Android NDK tidak ditemukan di $ANDROID_HOME/ndk"
              exit 1
            fi
            echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          fi
          echo "NDK: ${ANDROID_NDK_HOME:-$NDK_DIR}"

      - name: Cache PostgreSQL 16 (Android arm64) build
        uses: actions/cache@v4
        with:
          path: db-build/postgres
          key: build-postgres-${{ hashFiles('scripts/native/build-postgres.sh') }}

      - name: Build PostgreSQL 16 (Android arm64)
        run: bash scripts/native/build-postgres.sh

      - name: Upload PostgreSQL 16 (Android arm64) artifact
        uses: actions/upload-artifact@v4
        with:
          name: postgres-android-arm64
          path: |
            postgres-out/libpostgres.so
            postgres-out/libinitdb.so
            postgres-out/libpgctl.so
            postgres-out/libpsql.so
            postgres-out/postgres-share.zip
            postgres-out/postgres-version.txt
          if-no-files-found: error
  build-mariadb:
    name: MariaDB 10.11 (Android arm64)
    runs-on: ubuntu-latest
    env:
      ANDROID_API: "26"
      OUTPUT_DIR: ${{ github.workspace }}/mariadb-out
      OUT_DIR: ${{ github.workspace }}/mariadb-out
      WORK_DIR: ${{ github.workspace }}/db-build/mariadb
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Locate Android NDK
        run: |
          if [ -z "$ANDROID_NDK_HOME" ]; then
            NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
            if [ -z "$NDK_DIR" ]; then
              echo "::error::Android NDK tidak ditemukan di $ANDROID_HOME/ndk"
              exit 1
            fi
            echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          fi
          echo "NDK: ${ANDROID_NDK_HOME:-$NDK_DIR}"

      - name: Cache MariaDB 10.11 (Android arm64) build
        uses: actions/cache@v4
        with:
          path: db-build/mariadb
          key: build-mariadb-${{ hashFiles('scripts/native/build-mariadb.sh') }}

      - name: Build MariaDB 10.11 (Android arm64)
        run: bash scripts/native/build-mariadb.sh

      - name: Upload MariaDB 10.11 (Android arm64) artifact
        uses: actions/upload-artifact@v4
        with:
          name: mariadb-android-arm64
          path: |
            mariadb-out/libmariadbd.so
            mariadb-out/mariadb-share.zip
            mariadb-out/mariadb-version.txt
          if-no-files-found: error

  build-sendmail:
    name: Sendmail shim (Android arm64)
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust (stable) + target Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo (sendmail-shim)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/
            ~/.cargo/git/
            sendmail-shim/target/
          key: ${{ runner.os }}-cargo-sendmail-${{ hashFiles('sendmail-shim/Cargo.toml', 'sendmail-shim/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sendmail-

      - name: Install cargo-ndk
        run: command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked

      - name: Locate Android NDK
        run: |
          if [ -z "$ANDROID_NDK_HOME" ]; then
            NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
            if [ -z "$NDK_DIR" ]; then
              echo "::error::Android NDK tidak ditemukan di $ANDROID_HOME/ndk"
              exit 1
            fi
            echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          fi
          echo "NDK: ${ANDROID_NDK_HOME:-$NDK_DIR}"

      - name: Build sendmail shim (arm64-v8a)
        working-directory: sendmail-shim
        run: |
          cargo ndk -t arm64-v8a build --release \
            --bin webforge-sendmail
          BIN=target/aarch64-linux-android/release/webforge-sendmail
          if [ ! -f "$BIN" ]; then
            echo "::error::Binary webforge-sendmail tidak ditemukan: $BIN"
            exit 1
          fi
          mkdir -p ../sendmail-out
          cp "$BIN" ../sendmail-out/libsendmail.so
          TOOLCHAIN=$(ls -d "$ANDROID_NDK_HOME"/toolchains/llvm/prebuilt/* | head -1)
          "$TOOLCHAIN/bin/llvm-strip" ../sendmail-out/libsendmail.so
          chmod +x ../sendmail-out/libsendmail.so
          ls -lh ../sendmail-out/libsendmail.so

      - name: Verify sendmail shim ELF
        run: |
          SO=sendmail-out/libsendmail.so
          file "$SO"
          if ! readelf -h "$SO" | grep -q "AArch64"; then
            echo "::error::libsendmail.so bukan ELF AArch64"
            exit 1
          fi
          readelf -d "$SO" | grep NEEDED || true
          for lib in $(readelf -d "$SO" | grep NEEDED | sed -E 's/.*\[(.*)\]/\1/'); do
            case "$lib" in
              libc.so|libm.so|libdl.so|libz.so|liblog.so) ;;
              *)
                echo "::error::Dependensi dinamis tak terduga pada libsendmail.so: $lib"
                exit 1
                ;;
            esac
          done

      - name: Upload sendmail shim
        uses: actions/upload-artifact@v4
        with:
          name: sendmail-android-arm64
          path: sendmail-out/libsendmail.so
          if-no-files-found: error

  android:
    name: Android APK (debug)
    needs: [core, frontend, build-php, build-sendmail, build-caddy, build-nginx, build-apache, build-python, build-node, build-postgres, build-mariadb]
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Setup Rust (stable) + target Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/
            ~/.cargo/git/
            core/target/
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('core/Cargo.toml', 'core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-android-
            ${{ runner.os }}-cargo-

      - name: Install cargo-ndk
        run: command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked

      - name: Locate Android NDK
        run: |
          if [ -z "$ANDROID_NDK_HOME" ]; then
            NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
            if [ -z "$NDK_DIR" ]; then
              echo "::error::Android NDK tidak ditemukan di $ANDROID_HOME/ndk"
              exit 1
            fi
            echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          fi
          echo "NDK: ${ANDROID_NDK_HOME:-$NDK_DIR}"

      - name: Build Rust core untuk Android (arm64-v8a)
        working-directory: core
        run: cargo ndk -t arm64-v8a -o ../android/app/src/main/jniLibs build --release --lib

      - name: Verify native library
        run: |
          SO=android/app/src/main/jniLibs/arm64-v8a/libwebforge_core.so
          if [ ! -f "$SO" ]; then
            echo "::error::libwebforge_core.so tidak ditemukan: $SO"
            exit 1
          fi
          ls -lh "$SO"

      - name: Install root dependencies (Capacitor)
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Capacitor sync
        run: npx cap sync android


      - name: Download runtime binaries (jniLibs)
        uses: actions/download-artifact@v4
        with:
          pattern: "*-android-arm64"
          path: runtime-artifacts
          merge-multiple: false

      - name: Place runtime binaries and assets
        run: |
          JNILIBS=android/app/src/main/jniLibs/arm64-v8a
          ASSETS=android/app/src/main/assets
          mkdir -p "$JNILIBS" "$ASSETS"
          for so in libphp82.so libphp83.so libphp84.so libphpfpm82.so libphpfpm83.so libphpfpm84.so libsendmail.so libcaddy.so libnginx.so libhttpd.so libpython.so libnode.so libwebforge_node.so libc++_shared.so libpostgres.so libinitdb.so libpgctl.so libmariadbd.so; do
            SRC=$(find runtime-artifacts -name "$so" | head -1)
            if [ -z "$SRC" ]; then
              echo "::error::$so tidak ditemukan di artifact runtime"
              exit 1
            fi
            cp "$SRC" "$JNILIBS/$so"
            if ! readelf -h "$JNILIBS/$so" | grep -q "AArch64"; then
              echo "::error::$so bukan ELF AArch64"
              exit 1
            fi
            ls -lh "$JNILIBS/$so"
          done
          # libpsql.so opsional (bila terbuild)
          SRC=$(find runtime-artifacts -name "libpsql.so" | head -1)
          if [ -n "$SRC" ]; then cp "$SRC" "$JNILIBS/libpsql.so"; fi
          for asset in python-stdlib.zip python-version.txt node-version.txt npm.zip postgres-share.zip mariadb-share.zip; do
            SRC=$(find runtime-artifacts -name "$asset" | head -1)
            if [ -z "$SRC" ]; then
              echo "::error::Asset $asset tidak ditemukan di artifact runtime"
              exit 1
            fi
            cp "$SRC" "$ASSETS/$asset"
            ls -lh "$ASSETS/$asset"
          done
          # icudt74l.dat ada di ketiga artifact PHP (ICU sama); pastikan
          # isinya identik lalu salin satu salinan sebagai aset.
          ICUDT_COUNT=$(find runtime-artifacts -name "icudt74l.dat" | wc -l)
          if [ "$ICUDT_COUNT" -lt 1 ]; then
            echo "::error::icudt74l.dat tidak ditemukan di artifact PHP"
            exit 1
          fi
          ICUDT_HASHES=$(find runtime-artifacts -name "icudt74l.dat" -exec sha256sum {} + | awk '{print $1}' | sort -u | wc -l)
          if [ "$ICUDT_HASHES" -ne 1 ]; then
            echo "::error::icudt74l.dat antar artifact PHP tidak identik ($ICUDT_HASHES hash berbeda)"
            exit 1
          fi
          SRC=$(find runtime-artifacts -name "icudt74l.dat" | head -1)
          cp "$SRC" "$ASSETS/icudt74l.dat"
          ls -lh "$ASSETS/icudt74l.dat"

      - name: Download Composer 2.11.3 (sha256 resmi)
        run: |
          ASSETS=android/app/src/main/assets
          mkdir -p "$ASSETS" composer-dl
          curl -fsSL --retry 3 -o composer-dl/composer.phar "https://getcomposer.org/download/2.11.3/composer.phar"
          curl -fsSL --retry 3 -o composer-dl/composer.phar.sha256sum "https://getcomposer.org/download/2.11.3/composer.phar.sha256sum"
          EXPECTED=$(awk '{print $1}' composer-dl/composer.phar.sha256sum)
          ACTUAL=$(sha256sum composer-dl/composer.phar | awk '{print $1}')
          if [ -z "$EXPECTED" ] || [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::sha256 composer.phar tidak cocok: resmi=$EXPECTED aktual=$ACTUAL"
            exit 1
          fi
          SIZE=$(stat -c%s composer-dl/composer.phar)
          if [ "$SIZE" -le 1000000 ]; then
            echo "::error::composer.phar terlalu kecil ($SIZE bytes), diduga unduhan rusak"
            exit 1
          fi
          cp composer-dl/composer.phar "$ASSETS/composer.phar"
          echo "Composer 2.11.3 terverifikasi sha256=$ACTUAL ($SIZE bytes)"

      - name: Download cacert.pem (Mozilla via curl.se)
        run: |
          ASSETS=android/app/src/main/assets
          mkdir -p "$ASSETS"
          curl -fsSL --retry 3 -o "$ASSETS/cacert.pem" "https://curl.se/ca/cacert.pem"
          SIZE=$(stat -c%s "$ASSETS/cacert.pem")
          if [ "$SIZE" -le 100000 ]; then
            echo "::error::cacert.pem terlalu kecil ($SIZE bytes), diduga unduhan rusak"
            exit 1
          fi
          if ! grep -q "BEGIN CERTIFICATE" "$ASSETS/cacert.pem"; then
            echo "::error::cacert.pem tidak berisi sertifikat PEM"
            exit 1
          fi
          ls -lh "$ASSETS/cacert.pem"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Validate APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          if [ ! -f "$APK" ]; then
            echo "::error::APK tidak ditemukan: $APK"
            exit 1
          fi
          SIZE=$(stat -c%s "$APK")
          echo "APK: $APK ($SIZE bytes)"
          if [ "$SIZE" -le 1048576 ]; then
            echo "::error::APK terlalu kecil ($SIZE bytes), diduga build rusak"
            exit 1
          fi
          for entry in AndroidManifest.xml classes.dex lib/arm64-v8a/libwebforge_core.so lib/arm64-v8a/libphp82.so lib/arm64-v8a/libphp83.so lib/arm64-v8a/libphp84.so lib/arm64-v8a/libphpfpm82.so lib/arm64-v8a/libphpfpm83.so lib/arm64-v8a/libphpfpm84.so lib/arm64-v8a/libsendmail.so lib/arm64-v8a/libcaddy.so lib/arm64-v8a/libnginx.so lib/arm64-v8a/libhttpd.so lib/arm64-v8a/libpython.so lib/arm64-v8a/libnode.so lib/arm64-v8a/libwebforge_node.so lib/arm64-v8a/libc++_shared.so lib/arm64-v8a/libpostgres.so lib/arm64-v8a/libinitdb.so lib/arm64-v8a/libpgctl.so lib/arm64-v8a/libmariadbd.so assets/python-stdlib.zip assets/python-version.txt assets/node-version.txt assets/npm.zip assets/postgres-share.zip assets/mariadb-share.zip assets/composer.phar assets/cacert.pem assets/icudt74l.dat; do
            if ! unzip -l "$APK" | grep -q "$entry"; then
              echo "::error::APK tidak berisi $entry"
              exit 1
            fi
            echo "OK: $entry"
          done
          if unzip -l "$APK" | grep -q "lib/arm64-v8a/libphp\.so"; then
            echo "::error::APK masih berisi libphp.so lama (harus libphp82/83/84.so)"
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: webforge-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
