# WebForge Mobile CI — Rust core + frontend + PHP bundle + APK debug (Capacitor)
#
# Catatan:
# - TIDAK memakai android-actions/setup-android (pernah gagal di TeleCore).
#   Runner ubuntu-latest sudah menyediakan Android SDK + NDK.
# - libwebforge_core.so dihasilkan cargo-ndk di job android dan tidak
#   pernah di-commit.
# - libphp.so (PHP 8.3 CLI) di-cross-compile di job build-php untuk
#   aarch64-linux-android (API 26) dan tidak pernah di-commit. Ekstensi
#   target: bcmath, ctype, dom, fileinfo, filter, hash, json, mbstring,
#   openssl, pdo, pdo_sqlite, phar, posix, session, simplexml, sockets,
#   sqlite3, tokenizer, xml, xmlreader, xmlwriter, zip, zlib.
#   Dependensi dibangun statis dari source: SQLite (amalgamation),
#   libxml2 (cmake, tanpa iconv), OpenSSL, Oniguruma, libzip; zlib dari
#   sysroot NDK. Bila sebagian ekstensi terbukti tidak bisa dikompilasi
#   untuk Android, daftar di atas harus dikurangi di sini DAN di key
#   cache build-php, lalu dilaporkan apa adanya — jangan klaim ekstensi
#   yang tidak benar-benar terbuild. Daftar nyata di perangkat berasal
#   dari `php -m` lewat endpoint /api/runtimes/php/info.
# - Belum ada job release APK: signing belum dikonfigurasi.

name: WebForge Mobile CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (Rust)
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/
            ~/.cargo/git/
            core/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('core/Cargo.toml', 'core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cargo test
        run: cargo test --manifest-path core/Cargo.toml

      - name: Cargo build (release)
        run: cargo build --release --manifest-path core/Cargo.toml

  frontend:
    name: Frontend (React/Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Test
        working-directory: frontend
        run: npx vitest run

      - name: Build
        working-directory: frontend
        run: npm run build

  build-php:
    name: PHP 8.3 (Android arm64)
    runs-on: ubuntu-latest
    env:
      PHP_VERSION: "8.3.14"
      LIBXML2_VERSION: "2.12.9"
      OPENSSL_VERSION: "3.3.2"
      ONIGURUMA_VERSION: "6.9.9"
      SQLITE_VERSION: "3.46.1"
      SQLITE_AMALGAMATION: "3460100"
      LIBZIP_VERSION: "1.10.1"
      ANDROID_API: "26"
      PREFIX: ${{ github.workspace }}/php-prefix
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Locate Android NDK & setup toolchain
        run: |
          if [ -z "$ANDROID_NDK_HOME" ]; then
            NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
            if [ -z "$NDK_DIR" ]; then
              echo "::error::Android NDK tidak ditemukan di $ANDROID_HOME/ndk"
              exit 1
            fi
            echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          fi
          NDK="${ANDROID_NDK_HOME:-$NDK_DIR}"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          # Wrapper clang NDK adalah skrip yang mencari clang relatif
          # terhadap lokasinya sendiri, jadi symlink ke direktori lain
          # rusak. Pakai path absolut wrapper aslinya langsung.
          echo "$TOOLCHAIN/bin" >> "$GITHUB_PATH"
          {
            echo "CC=$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang"
            echo "CXX=$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang++"
            echo "AR=llvm-ar"
            echo "RANLIB=llvm-ranlib"
            echo "STRIP=llvm-strip"
            echo "ANDROID_NDK_ROOT=$NDK"
          } >> "$GITHUB_ENV"
          "$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang" --version

      - name: Cache PHP build
        id: php-cache
        uses: actions/cache@v4
        with:
          path: php-out
          key: php-8.3.14-android26-arm64-bcmath-ctype-dom-fileinfo-filter-hash-json-mbstring-openssl-pdo-pdo_sqlite-phar-posix-session-simplexml-sockets-sqlite3-tokenizer-xml-xmlreader-xmlwriter-zip-zlib

      - name: Build SQLite (amalgamation, static)
        if: steps.php-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$PREFIX/lib/pkgconfig" "$PREFIX/include" php-src
          cd php-src
          curl -fsSL -o sqlite.zip "https://www.sqlite.org/2024/sqlite-amalgamation-${SQLITE_AMALGAMATION}.zip"
          unzip -q sqlite.zip
          cd "sqlite-amalgamation-${SQLITE_AMALGAMATION}"
          $CC -O2 -fPIC -DSQLITE_THREADSAFE=1 -DSQLITE_ENABLE_COLUMN_METADATA \
            -DSQLITE_ENABLE_FTS4 -DSQLITE_ENABLE_FTS5 -DSQLITE_ENABLE_RTREE \
            -c sqlite3.c -o sqlite3.o
          $AR rcs "$PREFIX/lib/libsqlite3.a" sqlite3.o
          cp sqlite3.h sqlite3ext.h "$PREFIX/include/"
          cat > "$PREFIX/lib/pkgconfig/sqlite3.pc" <<EOF
          prefix=$PREFIX
          exec_prefix=\${prefix}
          libdir=\${exec_prefix}/lib
          includedir=\${prefix}/include

          Name: SQLite
          Description: SQL database engine
          Version: $SQLITE_VERSION
          Libs: -L\${libdir} -lsqlite3
          Libs.private: -lm -ldl
          Cflags: -I\${includedir}
          EOF

      - name: Build libxml2 (static, tanpa iconv)
        if: steps.php-cache.outputs.cache-hit != 'true'
        run: |
          cd php-src
          curl -fsSL -o libxml2.tar.xz "https://download.gnome.org/sources/libxml2/2.12/libxml2-${LIBXML2_VERSION}.tar.xz"
          tar xf libxml2.tar.xz
          cmake -S "libxml2-${LIBXML2_VERSION}" -B libxml2-build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DLIBXML2_WITH_ICONV=OFF \
            -DLIBXML2_WITH_PYTHON=OFF \
            -DLIBXML2_WITH_LZMA=OFF \
            -DLIBXML2_WITH_ZLIB=ON \
            -DLIBXML2_WITH_THREADS=ON \
            -DLIBXML2_WITH_HTTP=OFF \
            -DLIBXML2_WITH_FTP=OFF \
            -DLIBXML2_WITH_TESTS=OFF
          cmake --build libxml2-build -j"$(nproc)"
          cmake --install libxml2-build
          if [ ! -f "$PREFIX/lib/pkgconfig/libxml-2.0.pc" ]; then
            echo "libxml-2.0.pc tidak terinstall; menulis pkgconfig manual"
            mkdir -p "$PREFIX/lib/pkgconfig"
            cat > "$PREFIX/lib/pkgconfig/libxml-2.0.pc" <<EOF
          prefix=$PREFIX
          exec_prefix=\${prefix}
          libdir=\${exec_prefix}/lib
          includedir=\${prefix}/include

          Name: libXML
          Description: libXML library version2.
          Version: $LIBXML2_VERSION
          Libs: -L\${libdir} -lxml2
          Libs.private: -lz -lm -ldl
          Cflags: -I\${includedir}/libxml2
          EOF
          fi

      - name: Build OpenSSL (static)
        if: steps.php-cache.outputs.cache-hit != 'true'
        run: |
          cd php-src
          curl -fsSL -o openssl.tar.gz "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz"
          tar xf openssl.tar.gz
          cd "openssl-${OPENSSL_VERSION}"
          ./Configure android-arm64 "-D__ANDROID_API__=${ANDROID_API}" \
            no-shared no-tests no-docs \
            --prefix="$PREFIX" --openssldir="$PREFIX/ssl"
          make -j"$(nproc)" build_sw
          make install_sw

      - name: Build Oniguruma (static)
        if: steps.php-cache.outputs.cache-hit != 'true'
        run: |
          cd php-src
          curl -fsSL -o onig.tar.gz "https://github.com/kkos/oniguruma/releases/download/v${ONIGURUMA_VERSION}/onig-${ONIGURUMA_VERSION}.tar.gz"
          tar xf onig.tar.gz
          cd "onig-${ONIGURUMA_VERSION}"
          ./configure --host=aarch64-linux-android --prefix="$PREFIX" \
            --enable-static --disable-shared CC="$CC" AR="$AR" RANLIB="$RANLIB"
          make -j"$(nproc)"
          make install

      - name: Build libzip (static)
        if: steps.php-cache.outputs.cache-hit != 'true'
        run: |
          cd php-src
          curl -fsSL -o libzip.tar.gz "https://libzip.org/download/libzip-${LIBZIP_VERSION}.tar.gz"
          tar xf libzip.tar.gz
          cmake -S "libzip-${LIBZIP_VERSION}" -B libzip-build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DENABLE_COMMONCRYPTO=OFF \
            -DENABLE_GNUTLS=OFF \
            -DENABLE_OPENSSL=OFF \
            -DENABLE_MBEDTLS=OFF \
            -DENABLE_BZIP2=OFF \
            -DENABLE_LZMA=OFF \
            -DENABLE_ZSTD=OFF \
            -DBUILD_TOOLS=OFF \
            -DBUILD_REGRESS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_DOC=OFF
          cmake --build libzip-build -j"$(nproc)"
          cmake --install libzip-build

      - name: Build zlib (static)
        if: steps.php-cache.outputs.cache-hit != 'true'
        run: |
          # PHP configure mencari zlib lewat pkg-config; sysroot NDK
          # tidak menyediakan zlib.pc, jadi bangun zlib statis sendiri.
          curl -fsSL -o zlib.tar.gz "https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz"
          tar xf zlib.tar.gz
          cd zlib-1.3.1
          CC="$CC" AR="$AR" RANLIB="$RANLIB" ./configure --prefix="$PREFIX" --static
          make -j"$(nproc)"
          make install

      - name: Build PHP CLI
        if: steps.php-cache.outputs.cache-hit != 'true'
        run: |
          cd php-src
          curl -fsSL -o php.tar.gz "https://www.php.net/distributions/php-${PHP_VERSION}.tar.gz"
          tar xf php.tar.gz
          cd "php-${PHP_VERSION}"
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig:$PREFIX/share/pkgconfig"
          export PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig:$PREFIX/share/pkgconfig"
          export PKG_CONFIG="pkg-config --static"
          export CFLAGS="-O2 -fPIC"
          export CPPFLAGS="-I$PREFIX/include"
          export LDFLAGS="-L$PREFIX/lib"
          ./configure \
            --host=aarch64-linux-android \
            --build=x86_64-linux-gnu \
            --prefix="$PREFIX" \
            --with-config-file-path="$PREFIX/etc" \
            --disable-all \
            --disable-cgi \
            --disable-phpdbg \
            --without-pear \
            --enable-bcmath \
            --enable-ctype \
            --with-libxml \
            --enable-dom \
            --enable-fileinfo \
            --enable-filter \
            --enable-mbstring \
            --with-openssl \
            --enable-pdo \
            --with-pdo-sqlite \
            --enable-phar \
            --enable-posix \
            --enable-session \
            --enable-simplexml \
            --enable-sockets \
            --with-sqlite3 \
            --enable-tokenizer \
            --enable-xml \
            --enable-xmlreader \
            --enable-xmlwriter \
            --with-zip \
            --with-zlib \
            CC="$CC" CXX="$CXX" AR="$AR" RANLIB="$RANLIB" STRIP="$STRIP"
          # Bionic: configure mendeteksi simbol res_n* ada, tetapi
          # struct __res_state tidak utuh untuk aplikasi sehingga
          # ext/standard/dns.c gagal kompilasi. Matikan deteksi itu
          # di php_config.h; fungsi DNS PHP memakai jalur fallback.
          for sym in HAVE_RES_NINIT HAVE_RES_NSEARCH HAVE_RES_NCLOSE HAVE_RES_SEARCH HAVE_RES_INIT HAVE_DN_SKIPNAME HAVE_DN_EXPAND HAVE_GETDTABLESIZE; do
            sed -i "s/^#define $sym 1$/\/* #undef $sym *\//" main/php_config.h
          done
          grep -E "HAVE_RES_|HAVE_DN_" main/php_config.h || true
          # Bionic tidak mendeklarasikan getdtablesize(); PHP memanggilnya
          # tanpa guard di php_fopen_wrapper.c. Ganti dengan sysconf yang
          # setara (unistd.h sudah di-include file-file tersebut).
          grep -rl "getdtablesize()" ext main sapi | xargs sed -i 's/getdtablesize()/sysconf(_SC_OPEN_MAX)/g'
          make -j"$(nproc)"

      - name: Package libphp.so
        if: steps.php-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p php-out
          cp "php-src/php-${PHP_VERSION}/sapi/cli/php" php-out/libphp.so
          $STRIP php-out/libphp.so
          ls -lh php-out/libphp.so

      - name: Verify PHP ELF (ARM64, dependensi bionic saja)
        run: |
          SO=php-out/libphp.so
          if [ ! -f "$SO" ]; then
            echo "::error::libphp.so tidak ditemukan: $SO"
            exit 1
          fi
          file "$SO"
          readelf -h "$SO" | grep -E "Class|Type|Machine"
          if ! readelf -h "$SO" | grep -q "AArch64"; then
            echo "::error::libphp.so bukan ELF AArch64"
            exit 1
          fi
          readelf -d "$SO" | grep NEEDED || true
          for lib in $(readelf -d "$SO" | grep NEEDED | sed -E 's/.*\[(.*)\]/\1/'); do
            case "$lib" in
              libc.so|libm.so|libdl.so|libz.so|liblog.so) ;;
              *)
                echo "::error::Dependensi dinamis tak terduga pada libphp.so: $lib"
                exit 1
                ;;
            esac
          done

      - name: Upload PHP binary
        uses: actions/upload-artifact@v4
        with:
          name: php-android-arm64
          path: php-out/libphp.so
          if-no-files-found: error

  build-caddy:
    name: Caddy (Android arm64)
    runs-on: ubuntu-latest
    env:
      ANDROID_API: "26"
      OUTPUT_DIR: ${{ github.workspace }}/caddy-out
      OUT_DIR: ${{ github.workspace }}/caddy-out
      WORK_DIR: ${{ github.workspace }}/native-work/caddy
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache Caddy (Android arm64) build
        uses: actions/cache@v4
        with:
          path: native-work/caddy
          key: build-caddy-${{ hashFiles('scripts/native/build-caddy.sh') }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build Caddy (Android arm64)
        run: bash scripts/native/build-caddy.sh

      - name: Upload Caddy (Android arm64) artifact
        uses: actions/upload-artifact@v4
        with:
          name: caddy-android-arm64
          path: |
            caddy-out/libcaddy.so
          if-no-files-found: error
  build-nginx:
    name: Nginx (Android arm64)
    runs-on: ubuntu-latest
    env:
      ANDROID_API: "26"
      OUTPUT_DIR: ${{ github.workspace }}/nginx-out
      OUT_DIR: ${{ github.workspace }}/nginx-out
      WORK_DIR: ${{ github.workspace }}/native-work/nginx
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Locate Android NDK
        run: |
          if [ -z "$ANDROID_NDK_HOME" ]; then
            NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
            if [ -z "$NDK_DIR" ]; then
              echo "::error::Android NDK tidak ditemukan di $ANDROID_HOME/ndk"
              exit 1
            fi
            echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          fi
          echo "NDK: ${ANDROID_NDK_HOME:-$NDK_DIR}"

      - name: Cache Nginx (Android arm64) build
        uses: actions/cache@v4
        with:
          path: native-work/nginx
          key: build-nginx-${{ hashFiles('scripts/native/build-nginx.sh') }}

      - name: Build Nginx (Android arm64)
        run: bash scripts/native/build-nginx.sh

      - name: Upload Nginx (Android arm64) artifact
        uses: actions/upload-artifact@v4
        with:
          name: nginx-android-arm64
          path: |
            nginx-out/libnginx.so
          if-no-files-found: error
  build-apache:
    name: Apache httpd (Android arm64)
    runs-on: ubuntu-latest
    env:
      ANDROID_API: "26"
      OUTPUT_DIR: ${{ github.workspace }}/apache-out
      OUT_DIR: ${{ github.workspace }}/apache-out
      WORK_DIR: ${{ github.workspace }}/native-work/apache
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Locate Android NDK
        run: |
          if [ -z "$ANDROID_NDK_HOME" ]; then
            NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
            if [ -z "$NDK_DIR" ]; then
              echo "::error::Android NDK tidak ditemukan di $ANDROID_HOME/ndk"
              exit 1
            fi
            echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          fi
          echo "NDK: ${ANDROID_NDK_HOME:-$NDK_DIR}"

      - name: Cache Apache httpd (Android arm64) build
        uses: actions/cache@v4
        with:
          path: native-work/apache
          key: build-apache-${{ hashFiles('scripts/native/build-apache.sh') }}

      - name: Build Apache httpd (Android arm64)
        run: bash scripts/native/build-apache.sh

      - name: Upload Apache httpd (Android arm64) artifact
        uses: actions/upload-artifact@v4
        with:
          name: apache-android-arm64
          path: |
            apache-out/libhttpd.so
          if-no-files-found: error
  build-python:
    name: Python 3.12 (Android arm64)
    runs-on: ubuntu-latest
    env:
      ANDROID_API: "26"
      OUTPUT_DIR: ${{ github.workspace }}/python-out
      OUT_DIR: ${{ github.workspace }}/python-out
      WORK_DIR: ${{ github.workspace }}/python-build
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Locate Android NDK
        run: |
          if [ -z "$ANDROID_NDK_HOME" ]; then
            NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
            if [ -z "$NDK_DIR" ]; then
              echo "::error::Android NDK tidak ditemukan di $ANDROID_HOME/ndk"
              exit 1
            fi
            echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          fi
          echo "NDK: ${ANDROID_NDK_HOME:-$NDK_DIR}"

      - name: Cache Python 3.12 (Android arm64) build
        uses: actions/cache@v4
        with:
          path: python-build
          key: build-python-${{ hashFiles('scripts/native/build-python.sh') }}

      - name: Build Python 3.12 (Android arm64)
        run: bash scripts/native/build-python.sh

      - name: Upload Python 3.12 (Android arm64) artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-android-arm64
          path: |
            python-out/libpython.so
            python-out/python-stdlib.zip
            python-out/python-version.txt
          if-no-files-found: error
  build-node:
    name: Node.js (nodejs-mobile arm64)
    runs-on: ubuntu-latest
    env:
      ANDROID_API: "26"
      OUTPUT_DIR: ${{ github.workspace }}/node-out
      OUT_DIR: ${{ github.workspace }}/node-out
      WORK_DIR: ${{ github.workspace }}/node-build
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Locate Android NDK
        run: |
          if [ -z "$ANDROID_NDK_HOME" ]; then
            NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
            if [ -z "$NDK_DIR" ]; then
              echo "::error::Android NDK tidak ditemukan di $ANDROID_HOME/ndk"
              exit 1
            fi
            echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          fi
          echo "NDK: ${ANDROID_NDK_HOME:-$NDK_DIR}"

      - name: Cache Node.js (nodejs-mobile arm64) build
        uses: actions/cache@v4
        with:
          path: node-build
          key: build-node-${{ hashFiles('scripts/native/build-node.sh') }}


      - name: Build Node.js (nodejs-mobile arm64)
        run: bash scripts/native/build-node.sh

      - name: "Repack npm.tgz menjadi npm.zip (root package/)"
        run: |
          mkdir -p npm-repack
          tar -xzf node-out/npm.tgz -C npm-repack
          test -f npm-repack/package/bin/npm-cli.js
          (cd npm-repack && zip -qr ../node-out/npm.zip package)
          ls -lh node-out/npm.zip

      - name: Upload Node.js (nodejs-mobile arm64) artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-android-arm64
          path: |
            node-out/libnode.so
            node-out/libwebforge_node.so
            node-out/libc++_shared.so
            node-out/npm.zip
            node-out/node-version.txt
          if-no-files-found: error
  build-postgres:
    name: PostgreSQL 16 (Android arm64)
    runs-on: ubuntu-latest
    env:
      ANDROID_API: "26"
      OUTPUT_DIR: ${{ github.workspace }}/postgres-out
      OUT_DIR: ${{ github.workspace }}/postgres-out
      WORK_DIR: ${{ github.workspace }}/db-build/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Locate Android NDK
        run: |
          if [ -z "$ANDROID_NDK_HOME" ]; then
            NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
            if [ -z "$NDK_DIR" ]; then
              echo "::error::Android NDK tidak ditemukan di $ANDROID_HOME/ndk"
              exit 1
            fi
            echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          fi
          echo "NDK: ${ANDROID_NDK_HOME:-$NDK_DIR}"

      - name: Cache PostgreSQL 16 (Android arm64) build
        uses: actions/cache@v4
        with:
          path: db-build/postgres
          key: build-postgres-${{ hashFiles('scripts/native/build-postgres.sh') }}

      - name: Build PostgreSQL 16 (Android arm64)
        run: bash scripts/native/build-postgres.sh

      - name: Upload PostgreSQL 16 (Android arm64) artifact
        uses: actions/upload-artifact@v4
        with:
          name: postgres-android-arm64
          path: |
            postgres-out/libpostgres.so
            postgres-out/libinitdb.so
            postgres-out/libpgctl.so
            postgres-out/libpsql.so
            postgres-out/postgres-share.zip
            postgres-out/postgres-version.txt
          if-no-files-found: error
  build-mariadb:
    name: MariaDB 10.11 (Android arm64)
    runs-on: ubuntu-latest
    env:
      ANDROID_API: "26"
      OUTPUT_DIR: ${{ github.workspace }}/mariadb-out
      OUT_DIR: ${{ github.workspace }}/mariadb-out
      WORK_DIR: ${{ github.workspace }}/db-build/mariadb
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Locate Android NDK
        run: |
          if [ -z "$ANDROID_NDK_HOME" ]; then
            NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
            if [ -z "$NDK_DIR" ]; then
              echo "::error::Android NDK tidak ditemukan di $ANDROID_HOME/ndk"
              exit 1
            fi
            echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          fi
          echo "NDK: ${ANDROID_NDK_HOME:-$NDK_DIR}"

      - name: Cache MariaDB 10.11 (Android arm64) build
        uses: actions/cache@v4
        with:
          path: db-build/mariadb
          key: build-mariadb-${{ hashFiles('scripts/native/build-mariadb.sh') }}

      - name: Build MariaDB 10.11 (Android arm64)
        run: bash scripts/native/build-mariadb.sh

      - name: Upload MariaDB 10.11 (Android arm64) artifact
        uses: actions/upload-artifact@v4
        with:
          name: mariadb-android-arm64
          path: |
            mariadb-out/libmariadbd.so
            mariadb-out/mariadb-share.zip
            mariadb-out/mariadb-version.txt
          if-no-files-found: error

  android:
    name: Android APK (debug)
    needs: [core, frontend, build-php, build-caddy, build-nginx, build-apache, build-python, build-node, build-postgres, build-mariadb]
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Setup Rust (stable) + target Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/
            ~/.cargo/git/
            core/target/
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('core/Cargo.toml', 'core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-android-
            ${{ runner.os }}-cargo-

      - name: Install cargo-ndk
        run: command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked

      - name: Locate Android NDK
        run: |
          if [ -z "$ANDROID_NDK_HOME" ]; then
            NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
            if [ -z "$NDK_DIR" ]; then
              echo "::error::Android NDK tidak ditemukan di $ANDROID_HOME/ndk"
              exit 1
            fi
            echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          fi
          echo "NDK: ${ANDROID_NDK_HOME:-$NDK_DIR}"

      - name: Build Rust core untuk Android (arm64-v8a)
        working-directory: core
        run: cargo ndk -t arm64-v8a -o ../android/app/src/main/jniLibs build --release --lib

      - name: Verify native library
        run: |
          SO=android/app/src/main/jniLibs/arm64-v8a/libwebforge_core.so
          if [ ! -f "$SO" ]; then
            echo "::error::libwebforge_core.so tidak ditemukan: $SO"
            exit 1
          fi
          ls -lh "$SO"

      - name: Download PHP binary (libphp.so)
        uses: actions/download-artifact@v4
        with:
          name: php-android-arm64
          path: android/app/src/main/jniLibs/arm64-v8a

      - name: Verify PHP native library
        run: |
          SO=android/app/src/main/jniLibs/arm64-v8a/libphp.so
          if [ ! -f "$SO" ]; then
            echo "::error::libphp.so tidak ditemukan: $SO"
            exit 1
          fi
          file "$SO"
          if ! readelf -h "$SO" | grep -q "AArch64"; then
            echo "::error::libphp.so bukan ELF AArch64"
            exit 1
          fi
          ls -lh "$SO"

      - name: Install root dependencies (Capacitor)
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Capacitor sync
        run: npx cap sync android


      - name: Download runtime binaries (jniLibs)
        uses: actions/download-artifact@v4
        with:
          pattern: "*-android-arm64"
          path: runtime-artifacts
          merge-multiple: false

      - name: Place runtime binaries and assets
        run: |
          JNILIBS=android/app/src/main/jniLibs/arm64-v8a
          ASSETS=android/app/src/main/assets
          mkdir -p "$JNILIBS" "$ASSETS"
          for so in libcaddy.so libnginx.so libhttpd.so libpython.so libnode.so libwebforge_node.so libc++_shared.so libpostgres.so libinitdb.so libpgctl.so libmariadbd.so; do
            SRC=$(find runtime-artifacts -name "$so" | head -1)
            if [ -z "$SRC" ]; then
              echo "::error::$so tidak ditemukan di artifact runtime"
              exit 1
            fi
            cp "$SRC" "$JNILIBS/$so"
            if ! readelf -h "$JNILIBS/$so" | grep -q "AArch64"; then
              echo "::error::$so bukan ELF AArch64"
              exit 1
            fi
            ls -lh "$JNILIBS/$so"
          done
          # libpsql.so opsional (bila terbuild)
          SRC=$(find runtime-artifacts -name "libpsql.so" | head -1)
          if [ -n "$SRC" ]; then cp "$SRC" "$JNILIBS/libpsql.so"; fi
          for asset in python-stdlib.zip python-version.txt node-version.txt npm.zip postgres-share.zip mariadb-share.zip; do
            SRC=$(find runtime-artifacts -name "$asset" | head -1)
            if [ -z "$SRC" ]; then
              echo "::error::Asset $asset tidak ditemukan di artifact runtime"
              exit 1
            fi
            cp "$SRC" "$ASSETS/$asset"
            ls -lh "$ASSETS/$asset"
          done

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Validate APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          if [ ! -f "$APK" ]; then
            echo "::error::APK tidak ditemukan: $APK"
            exit 1
          fi
          SIZE=$(stat -c%s "$APK")
          echo "APK: $APK ($SIZE bytes)"
          if [ "$SIZE" -le 1048576 ]; then
            echo "::error::APK terlalu kecil ($SIZE bytes), diduga build rusak"
            exit 1
          fi
          for entry in AndroidManifest.xml classes.dex lib/arm64-v8a/libwebforge_core.so lib/arm64-v8a/libphp.so lib/arm64-v8a/libcaddy.so lib/arm64-v8a/libnginx.so lib/arm64-v8a/libhttpd.so lib/arm64-v8a/libpython.so lib/arm64-v8a/libnode.so lib/arm64-v8a/libwebforge_node.so lib/arm64-v8a/libc++_shared.so lib/arm64-v8a/libpostgres.so lib/arm64-v8a/libinitdb.so lib/arm64-v8a/libpgctl.so lib/arm64-v8a/libmariadbd.so assets/python-stdlib.zip assets/python-version.txt assets/node-version.txt assets/npm.zip assets/postgres-share.zip assets/mariadb-share.zip; do
            if ! unzip -l "$APK" | grep -q "$entry"; then
              echo "::error::APK tidak berisi $entry"
              exit 1
            fi
            echo "OK: $entry"
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: webforge-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
